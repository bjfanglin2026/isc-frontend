<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>用户管理 - 远陌云视频监控平台</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #1a1a2e; color: #eee; }
        .header { background: #16213e; padding: 15px 30px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #0f3460; }
        .header h1 { font-size: 20px; color: #00d9ff; }
        .header-nav { display: flex; gap: 20px; }
        .header-nav a { color: #eee; text-decoration: none; padding: 8px 16px; border-radius: 6px; }
        .header-nav a:hover { background: #0f3460; }
        .header-nav a.active { background: #0f3460; color: #00d9ff; }
        .container { max-width: 1200px; margin: 30px auto; padding: 0 20px; }
        .panel { background: #16213e; border-radius: 12px; border: 1px solid #0f3460; margin-bottom: 20px; }
        .panel-header { padding: 15px 20px; border-bottom: 1px solid #0f3460; display: flex; justify-content: space-between; align-items: center; }
        .panel-header h2 { font-size: 16px; color: #00d9ff; }
        .toolbar { display: flex; gap: 10px; }
        .btn { padding: 8px 16px; border: none; border-radius: 6px; cursor: pointer; font-size: 14px; transition: all 0.2s; }
        .btn-primary { background: #00d9ff; color: #1a1a2e; font-weight: bold; }
        .btn-primary:hover { background: #00b8d9; }
        .btn-danger { background: #ef4444; color: white; }
        .btn-danger:hover { background: #dc2626; }
        .btn-secondary { background: #0f3460; color: #eee; }
        .btn-secondary:hover { background: #1a4a80; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 12px 15px; text-align: left; border-bottom: 1px solid #0f3460; }
        th { background: #0f3460; color: #00d9ff; font-weight: 500; font-size: 14px; }
        tr:hover { background: rgba(0,217,255,0.05); }
        td { font-size: 14px; }
        .badge { display: inline-block; padding: 4px 10px; border-radius: 12px; font-size: 12px; }
        .badge-admin { background: #7c3aed; color: white; }
        .badge-user { background: #2563eb; color: white; }
        .badge-enabled { background: #16a34a; color: white; }
        .badge-disabled { background: #dc2626; color: white; }
        .action-btns { display: flex; gap: 8px; }
        .action-btns button { padding: 6px 12px; font-size: 12px; }
        .modal { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.7); display: flex; align-items: center; justify-content: center; z-index: 1000; }
        .modal.hidden { display: none; }
        .modal-content { background: #16213e; border-radius: 12px; width: 500px; max-height: 80vh; overflow-y: auto; border: 1px solid #0f3460; }
        .modal-header { padding: 20px; border-bottom: 1px solid #0f3460; display: flex; justify-content: space-between; align-items: center; }
        .modal-header h3 { color: #00d9ff; }
        .modal-close { background: none; border: none; color: #888; font-size: 24px; cursor: pointer; }
        .modal-close:hover { color: #eee; }
        .modal-body { padding: 20px; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 6px; font-size: 14px; color: #888; }
        .form-group input, .form-group select { width: 100%; padding: 10px 12px; border: 1px solid #0f3460; border-radius: 6px; background: #1a1a2e; color: #eee; font-size: 14px; }
        .form-group input:focus { outline: none; border-color: #00d9ff; }
        .modal-footer { padding: 15px 20px; border-top: 1px solid #0f3460; display: flex; justify-content: flex-end; gap: 10px; }
        .camera-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-top: 10px; }
        .camera-item { padding: 10px; background: #1a1a2e; border: 1px solid #0f3460; border-radius: 6px; cursor: pointer; }
        .camera-item:hover { border-color: #00d9ff; }
        .camera-item.selected { border-color: #00d9ff; background: rgba(0,217,255,0.1); }
        .camera-item input { margin-right: 8px; }
        .login-tip { text-align: center; padding: 40px; color: #888; }
        .hidden { display: none !important; }
    </style>
</head>
<body>
    <div class="header">
        <h1>远陌云视频监控平台 - 用户管理</h1>
        <div class="header-nav">
            <a href="index.html">视频监控</a>
            <a href="admin.html" class="active">用户管理</a>
        </div>
    </div>
    
    <div class="container">
        <div id="loginTip" class="panel">
            <div class="login-tip">
                <p style="margin-bottom: 15px;">请先登录管理员账号</p>
                <button class="btn btn-primary" onclick="showLoginModal()">管理员登录</button>
            </div>
        </div>
        
        <div id="userPanel" class="panel hidden">
            <div class="panel-header">
                <h2>用户列表</h2>
                <div class="toolbar">
                    <button class="btn btn-primary" onclick="showCreateUserModal()">+ 创建用户</button>
                </div>
            </div>
            <table>
                <thead>
                    <tr>
                        <th>ID</th><th>用户名</th><th>显示名称</th><th>角色</th><th>状态</th><th>创建时间</th><th>操作</th>
                    </tr>
                </thead>
                <tbody id="userTable"></tbody>
            </table>
        </div>
        
        <div id="cameraPanel" class="panel hidden">
            <div class="panel-header">
                <h2>摄像机权限 - <span id="cameraPanelUser"></span></h2>
                <div class="toolbar">
                    <button class="btn btn-secondary" onclick="showAddCameraModal()">+ 添加摄像机</button>
                    <button class="btn btn-secondary" onclick="loadUsers()">返回用户列表</button>
                </div>
            </div>
            <table>
                <thead>
                    <tr>
                        <th>ID</th><th>摄像机编号</th><th>摄像机名称</th><th>权限</th><th>操作</th>
                    </tr>
                </thead>
                <tbody id="cameraTable"></tbody>
            </table>
        </div>
    </div>
    
    <!-- Login Modal -->
    <div id="loginModal" class="modal hidden">
        <div class="modal-content" style="width:360px">
            <div class="modal-header">
                <h3>管理员登录</h3>
                <button class="modal-close" onclick="hideLoginModal()">x</button>
            </div>
            <div class="modal-body">
                <div class="form-group"><label>用户名</label><input type="text" id="loginUsername"></div>
                <div class="form-group"><label>密码</label><input type="password" id="loginPassword"></div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="hideLoginModal()">取消</button>
                <button class="btn btn-primary" onclick="handleLogin()">登录</button>
            </div>
        </div>
    </div>
    
    <!-- User Modal -->
    <div id="userModal" class="modal hidden">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="userModalTitle">创建用户</h3>
                <button class="modal-close" onclick="hideUserModal()">x</button>
            </div>
            <div class="modal-body">
                <input type="hidden" id="editUserId">
                <div class="form-group"><label>用户名</label><input type="text" id="userUsername"></div>
                <div class="form-group"><label>显示名称</label><input type="text" id="userDisplayName"></div>
                <div class="form-group"><label>密码 <span style="color:#666">(不修改请留空)</span></label><input type="password" id="userPassword"></div>
                <div class="form-group"><label>角色</label>
                    <select id="userRole"><option value="USER">普通用户</option><option value="ADMIN">管理员</option></select>
                </div>
                <div class="form-group"><label>状态</label>
                    <select id="userEnabled"><option value="true">启用</option><option value="false">禁用</option></select>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="hideUserModal()">取消</button>
                <button class="btn btn-primary" onclick="handleSaveUser()">保存</button>
            </div>
        </div>
    </div>
    
    <!-- Camera Modal -->
    <div id="cameraModal" class="modal hidden">
        <div class="modal-content">
            <div class="modal-header">
                <h3>分配摄像机</h3>
                <button class="modal-close" onclick="hideCameraModal()">x</button>
            </div>
            <div class="modal-body">
                <p style="margin-bottom:10px;color:#888;">选择要分配的摄像机：</p>
                <div id="cameraSelectList" class="camera-grid"></div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="hideCameraModal()">取消</button>
                <button class="btn btn-primary" onclick="handleAddCameras()">确认分配</button>
            </div>
        </div>
    </div>

    <script>
    const API = '/api';
    let currentUser = null;
    let allCameras = [];
    let selectedCameras = [];
    let cameraPanelUserId = null;

    function checkLogin() {
        const saved = sessionStorage.getItem('isc_admin_user');
        if (saved) {
            currentUser = JSON.parse(saved);
            showUserPanel();
            loadUsers();
        } else {
            showLoginTip();
        }
    }

    function showLoginTip() {
        document.getElementById('loginTip').classList.remove('hidden');
        document.getElementById('userPanel').classList.add('hidden');
        document.getElementById('cameraPanel').classList.add('hidden');
    }

    function showUserPanel() {
        document.getElementById('loginTip').classList.add('hidden');
        document.getElementById('userPanel').classList.remove('hidden');
        document.getElementById('cameraPanel').classList.add('hidden');
    }

    function showCameraPanel(userId, userName) {
        cameraPanelUserId = userId;
        document.getElementById('loginTip').classList.add('hidden');
        document.getElementById('userPanel').classList.add('hidden');
        document.getElementById('cameraPanel').classList.remove('hidden');
        document.getElementById('cameraPanelUser').textContent = userName;
        loadUserCameras(userId);
    }

    function showLoginModal() { document.getElementById('loginModal').classList.remove('hidden'); }
    function hideLoginModal() { document.getElementById('loginModal').classList.add('hidden'); }
    function showCreateUserModal() {
        document.getElementById('userModalTitle').textContent = '创建用户';
        document.getElementById('editUserId').value = '';
        document.getElementById('userUsername').value = '';
        document.getElementById('userUsername').disabled = false;
        document.getElementById('userDisplayName').value = '';
        document.getElementById('userPassword').value = '';
        document.getElementById('userRole').value = 'USER';
        document.getElementById('userEnabled').value = 'true';
        document.getElementById('userModal').classList.remove('hidden');
    }
    function hideUserModal() { document.getElementById('userModal').classList.add('hidden'); }
    function showCameraModal() { document.getElementById('cameraModal').classList.remove('hidden'); }
    function hideCameraModal() { document.getElementById('cameraModal').classList.add('hidden'); selectedCameras = []; }

    async function handleLogin() {
        const username = document.getElementById('loginUsername').value;
        const password = document.getElementById('loginPassword').value;
        const res = await fetch(API + '/admin/login', {
            method: 'POST', headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({username, password})
        });
        const data = await res.json();
        if (data.success) {
            currentUser = data.user;
            sessionStorage.setItem('isc_admin_user', JSON.stringify(currentUser));
            hideLoginModal();
            showUserPanel();
            loadUsers();
        } else {
            alert(data.msg || '登录失败');
        }
    }

    function handleLogout() {
        sessionStorage.removeItem('isc_admin_user');
        currentUser = null;
        showLoginTip();
    }

    async function loadUsers() {
        const res = await fetch(API + '/admin/users');
        const data = await res.json();
        if (data.success) renderUserTable(data.list);
    }

    function renderUserTable(users) {
        const tbody = document.getElementById('userTable');
        tbody.innerHTML = '';
        users.forEach(u => {
            const tr = document.createElement('tr');
            tr.innerHTML = '<td>' + u.id + '</td>' +
                '<td>' + u.username + '</td>' +
                '<td>' + (u.displayName || '-') + '</td>' +
                '<td><span class="badge ' + (u.role === 'ADMIN' ? 'badge-admin' : 'badge-user') + '">' + (u.role === 'ADMIN' ? '管理员' : '普通用户') + '</span></td>' +
                '<td><span class="badge ' + (u.enabled ? 'badge-enabled' : 'badge-disabled') + '">' + (u.enabled ? '启用' : '禁用') + '</span></td>' +
                '<td>' + (u.createTime ? u.createTime.replace('T', ' ').substring(0, 19) : '-') + '</td>' +
                '<td><div class="action-btns">' +
                '<button class="btn btn-secondary" onclick="editUser(' + u.id + ',\'' + u.username + '\',\'' + (u.displayName || '') + '\',\'' + u.role + '\',' + u.enabled + ')">编辑</button>' +
                '<button class="btn btn-secondary" onclick="showCameraPanel(' + u.id + ',\'' + u.username + '\')">分配摄像机</button>' +
                '<button class="btn btn-danger" onclick="deleteUser(' + u.id + ')">删除</button></div></td>';
            tbody.appendChild(tr);
        });
    }

    function editUser(id, username, displayName, role, enabled) {
        document.getElementById('userModalTitle').textContent = '编辑用户';
        document.getElementById('editUserId').value = id;
        document.getElementById('userUsername').value = username;
        document.getElementById('userUsername').disabled = true;
        document.getElementById('userDisplayName').value = displayName;
        document.getElementById('userPassword').value = '';
        document.getElementById('userRole').value = role;
        document.getElementById('userEnabled').value = enabled ? 'true' : 'false';
        document.getElementById('userModal').classList.remove('hidden');
    }

    async function handleSaveUser() {
        const id = document.getElementById('editUserId').value;
        const username = document.getElementById('userUsername').value;
        const displayName = document.getElementById('userDisplayName').value;
        const password = document.getElementById('userPassword').value;
        const role = document.getElementById('userRole').value;
        const enabled = document.getElementById('userEnabled').value === 'true';
        const body = {username, displayName, role, enabled};
        if (password) body.password = password;
        const url = id ? API + '/admin/user/' + id : API + '/admin/user';
        const method = id ? 'PUT' : 'POST';
        const res = await fetch(url, {method, headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body)});
        const data = await res.json();
        if (data.success) { hideUserModal(); loadUsers(); }
        else alert(data.msg || '保存失败');
    }

    async function deleteUser(id) {
        if (!confirm('确定要删除这个用户吗？')) return;
        const res = await fetch(API + '/admin/user/' + id, {method: 'DELETE'});
        const data = await res.json();
        if (data.success) loadUsers();
        else alert(data.msg || '删除失败');
    }

    async function loadAllCameras() {
        const res = await fetch(API + '/video/cameras?pageNo=1&pageSize=100');
        const data = await res.json();
        if (data.success) {
            allCameras = data.list || [];
            renderCameraSelect();
        }
    }

    function renderCameraSelect() {
        const container = document.getElementById('cameraSelectList');
        container.innerHTML = '';
        allCameras.forEach(c => {
            const div = document.createElement('div');
            div.className = 'camera-item';
            div.innerHTML = '<input type="checkbox" style="display:none">' + c.cameraName + ' (' + c.cameraTypeName + ')';
            div.onclick = function() {
                const cb = this.querySelector('input');
                cb.checked = !cb.checked;
                this.classList.toggle('selected', cb.checked);
                if (cb.checked) selectedCameras.push({cameraIndexCode: c.cameraIndexCode, cameraName: c.cameraName});
                else selectedCameras = selectedCameras.filter(x => x.cameraIndexCode !== c.cameraIndexCode);
            };
            container.appendChild(div);
        });
    }

    async function handleAddCameras() {
        if (selectedCameras.length === 0) { alert('请选择至少一个摄像机'); return; }
        const cameras = selectedCameras.map(c => ({...c, permissionType: 1}));
        const res = await fetch(API + '/admin/user/' + cameraPanelUserId + '/cameras', {
            method: 'POST', headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({cameras})
        });
        const data = await res.json();
        if (data.success) { hideCameraModal(); loadUserCameras(cameraPanelUserId); }
        else alert(data.msg || '分配失败');
    }

    async function loadUserCameras(userId) {
        const res = await fetch(API + '/admin/user/' + userId + '/cameras');
        const data = await res.json();
        if (data.success) renderCameraTable(data.list);
    }

    function renderCameraTable(cameras) {
        const tbody = document.getElementById('cameraTable');
        if (!cameras || cameras.length === 0) {
            tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;color:#888;padding:30px;">暂无分配的摄像机</td></tr>';
            return;
        }
        tbody.innerHTML = '';
        cameras.forEach(c => {
            const tr = document.createElement('tr');
            tr.innerHTML = '<td>' + c.id + '</td>' +
                '<td style="font-family:monospace;font-size:12px;">' + c.cameraIndexCode + '</td>' +
                '<td>' + c.cameraName + '</td>' +
                '<td>' + (c.permissionType === 1 ? '预览' : '控制') + '</td>' +
                '<td><button class="btn btn-danger" onclick="removeCamera(\'' + c.cameraIndexCode + '\')">移除</button></td>';
            tbody.appendChild(tr);
        });
    }

    async function removeCamera(cameraIndexCode) {
        const res = await fetch(API + '/admin/user/' + cameraPanelUserId + '/camera/' + cameraIndexCode, {method: 'DELETE'});
        const data = await res.json();
        if (data.success) loadUserCameras(cameraPanelUserId);
        else alert(data.msg || '移除失败');
    }

    function showAddCameraModal() { selectedCameras = []; loadAllCameras(); showCameraModal(); }

    checkLogin();
    </script>
</body>
</html>
